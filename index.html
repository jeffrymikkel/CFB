    for (var i = 0; i < stats.length; i++) {
      if (test(stats[i])) return stats[i].displayValue || stats[i].summary || '';
    }
    return '';
  }

  function parseRecord(s) {
    var m = String(s || '').match(/^(\d+)-(\d+)(?:-(\d+))?/);
    if (!m) return { w: 0, l: 0, t: 0, pct: 0 };
    var w = +m[1], l = +m[2], t = m[3] ? +m[3] : 0;
    var games = w + l + t;
    return { w: w, l: l, t: t, pct: games ? (w + t / 2) / games : 0 };
  }

  function loadStandings(st) {
    if (!st.standingsPromise) {
      var seasonWait = loadSchedule(st).catch(function () { return null; });
      st.standingsPromise = Promise.all([resolveGroupId(st), seasonWait]).then(function (res) {
        var gid = res[0];
        st.groupId = gid;
        var season = st.season || currentSeasonYear();
        var url = STANDINGS_ROOTS[st.sport] + (st.sport === 'nfl'
          ? '?level=3&season=' + season
          : '?group=' + encodeURIComponent(gid || '') + '&season=' + season);
        if (st.sport === 'cfb' && !gid) throw new Error('No conference');
        return fetchJson(url);
      });
      st.standingsPromise.catch(function () { st.standingsPromise = null; });
    }
    return st.standingsPromise;
  }

  function renderStandingsTab(sheet, st, content) {
    content.appendChild(mk('div', 'sheet-note', 'Loading standings…'));
    loadStandings(st).then(function (data) {
      if (sheet.closed || st.tab !== 'standings') return;
      content.innerHTML = '';
      var groups = collectStandingGroups(data, []);
      var mine = null;
      groups.forEach(function (gr) {
        gr.entries.forEach(function (e) {
          if (e.team && String(e.team.id) === String(st.team.id)) mine = gr;
        });
      });
      if (!mine && st.sport === 'cfb' && groups.length === 1) mine = groups[0];
      if (!mine || !mine.entries.length) {
        content.appendChild(mk('div', 'sheet-note', 'Standings aren’t available for this team.'));
        return;
      }

      var rows = mine.entries.map(function (e) {
        var wantType = st.sport === 'nfl' ? 'vsdiv' : 'vsconf';
        var conf = statDisplay(e, function (s) { return s.type === wantType; });
        var overall = statDisplay(e, function (s) { return s.name === 'overall' || s.type === 'total'; });
        return { e: e, conf: conf, overall: overall, c: parseRecord(conf), o: parseRecord(overall) };
      });
      rows.sort(function (x, y) {
        if (st.sport === 'nfl') {
          if (y.o.pct !== x.o.pct) return y.o.pct - x.o.pct;
          if (y.c.pct !== x.c.pct) return y.c.pct - x.c.pct;
        } else {
          if (y.c.pct !== x.c.pct) return y.c.pct - x.c.pct;
          if (y.c.w !== x.c.w) return y.c.w - x.c.w;
          if (y.o.pct !== x.o.pct) return y.o.pct - x.o.pct;
          if (y.o.w !== x.o.w) return y.o.w - x.o.w;
        }
        return teamLabel(x.e.team, st.sport).localeCompare(teamLabel(y.e.team, st.sport));
      });

      var card = mk('div', 'gs-card');
      var title = (mine.name || (st.sport === 'nfl' ? 'Division' : 'Conference')) + ' Standings';
      card.appendChild(mk('div', 'gs-card-title', title));
      var head = mk('div', 'st-row st-head');
      head.appendChild(mk('span', 'st-team', 'TEAM'));
      head.appendChild(mk('span', 'st-rec', st.sport === 'nfl' ? 'DIV' : 'CONF'));
      head.appendChild(mk('span', 'st-rec', 'OVR'));
      card.appendChild(head);

      rows.forEach(function (r) {
        var isMe = String(r.e.team.id) === String(st.team.id);
        var row = mk('button', 'st-row' + (isMe ? ' me' : ''));
        var teamCell = mk('span', 'st-team');
        teamCell.appendChild(mkLogo(teamLogoUrl(r.e.team), 'sch-logo'));
        teamCell.appendChild(mk('span', 'st-name', teamLabel(r.e.team, st.sport)));
        row.appendChild(teamCell);
        row.appendChild(mk('span', 'st-rec', r.conf || '–'));
        row.appendChild(mk('span', 'st-rec', r.overall || '–'));
        if (!isMe) {
          row.addEventListener('click', function () {
            openTeamSheet({
              id: String(r.e.team.id),
              name: r.e.team.displayName || teamLabel(r.e.team, st.sport),
              logo: teamLogoUrl(r.e.team),
              color: r.e.team.color,
              confId: st.sport === 'cfb' ? (st.groupId || st.team.confId) : null,
              record: r.overall
            }, st.sport);
          });
        }
        card.appendChild(row);
      });
      content.appendChild(card);
    }).catch(function () {
      if (sheet.closed || st.tab !== 'standings') return;
      content.innerHTML = '';
      var wrap = mk('div', 'sheet-note');
      wrap.appendChild(mk('div', null, 'Couldn’t load the standings.'));
      var retry = mk('button', 'sheet-retry', 'Try again');
      retry.addEventListener('click', function () { content.innerHTML = ''; renderStandingsTab(sheet, st, content); });
      wrap.appendChild(retry);
      content.appendChild(wrap);
    });
  }

  // ---- Fetching ----
  function buildScoreboardUrl(sport, tab) {
    var base = sport === 'nfl' ? NFL_API : CFB_API;
    var url = base + '?limit=200';
    // Without groups=80 (FBS), ESPN's CFB scoreboard endpoint only returns a curated
    // subset of ~25 "featured" games instead of the full weekly slate -- confirmed live
    // this session (24 events without it vs. 86 with it, for the same week).
    if (sport !== 'nfl') url += '&groups=80';
    if (tab) url += '&seasontype=' + tab.seasonType + '&week=' + tab.week;
    return url;
  }

  // ESPN's feed is cached for ~10 seconds (Cache-Control max-age), and browsers honor that, so a
  // quick second tap on Refresh would get the same stored response. A throwaway query param
  // makes every refresh a brand-new URL. (Deliberately not using cache:'no-store', which adds
  // request headers that trigger a CORS preflight.)
  function freshUrl(url) {
    return url + (url.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();
  }

  function showContentLoading() {
    setStatus('<span class="spinner"></span>Loading games...', false);
    timelineListEl.innerHTML = '';
    emptyEl.style.display = 'none';
  }

  function showContentError() {
    timelineListEl.innerHTML = '';
    emptyEl.style.display = 'none';
    setStatus('Couldn\'t load games right now. Check your connection and try again.', true);
  }

  function updateStarSubNavState() {
    var finished = cfbGames.length > 0 && cfbGames.every(function (g) { return g.state === 'post'; });
    subNavBtns.starred.disabled = finished;
  }

  function loadCfbGames(tab) {
    return fetch(freshUrl(buildScoreboardUrl('cfb', tab)))
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var games = (data.events || []).map(function (e) { return extractGame(e, 'cfb'); }).filter(function (g) { return g !== null; });
        games.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        cfbGames = games;
        runAutoStar(cfbGames);
        updateStarSubNavState();
      });
  }

  function loadNflGames(tab) {
    return fetch(freshUrl(buildScoreboardUrl('nfl', tab)))
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var games = (data.events || []).map(function (e) { return extractGame(e, 'nfl'); }).filter(function (g) { return g !== null; });
        games.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
        nflGames = games;
        nflLoaded = true;
      });
  }

  function fetchCfbWeek(tab) {
    showContentLoading();
    loadCfbGames(tab).then(function () {
      setStatus('', false);
      if (!isNflView()) renderTimeline();
    }).catch(showContentError);
  }

  function fetchNflWeek(tab) {
    showContentLoading();
    loadNflGames(tab).then(function () {
      setStatus('', false);
      if (isNflView()) renderTimeline();
    }).catch(showContentError);
  }

  // ---- Week tabs ----
  function buildWeekTabs(calendar, maxRegularWeek, postseasonLabels) {
    var tabs = [];
    var regSeason = null, postseason = null;
    (calendar || []).forEach(function (g) {
      if (String(g.value) === '2') regSeason = g;
      if (String(g.value) === '3') postseason = g;
    });
    if (regSeason) {
      regSeason.entries.forEach(function (entry) {
        var m = /^Week (\d+)$/.exec(entry.label);
        if (m && (!maxRegularWeek || parseInt(m[1], 10) <= maxRegularWeek)) {
          tabs.push({ label: entry.label, seasonType: 2, week: parseInt(entry.value, 10), sortKey: parseInt(m[1], 10) });
        }
      });
    }
    tabs.sort(function (a, b) { return a.sortKey - b.sortKey; });
    if (postseason && postseasonLabels) {
      postseasonLabels.forEach(function (wantedLabel) {
        var entry = null;
        postseason.entries.forEach(function (e) { if (e.label === wantedLabel) entry = e; });
        if (entry) {
          tabs.push({ label: wantedLabel, seasonType: parseInt(postseason.value, 10), week: parseInt(entry.value, 10) });
        }
      });
    }
    return tabs;
  }

  function findDefaultTabIndex(tabs, weekNumber, seasonType) {
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].seasonType === seasonType && tabs[i].week === weekNumber) return i;
    }
    if (seasonType === 3) return tabs.length - 1;
    if (seasonType === 2) {
      for (var j = tabs.length - 1; j >= 0; j--) {
        if (tabs[j].seasonType === 2 && tabs[j].week <= weekNumber) return j;
      }
    }
    return 0;
  }

  function restoreSelectedIndex(tabs, storageKey, fallbackWeekNumber, fallbackSeasonType) {
    var raw = localStorage.getItem(storageKey);
    if (raw) {
      try {
        var saved = JSON.parse(raw);
        for (var i = 0; i < tabs.length; i++) {
          if (tabs[i].seasonType === saved.seasonType && tabs[i].week === saved.week) return i;
        }
      } catch (e) {}
    }
    return findDefaultTabIndex(tabs, fallbackWeekNumber, fallbackSeasonType);
  }

  function renderWeekStrip() {
    var tabs = isNflView() ? nflWeekTabs : cfbWeekTabs;
    var selIdx = isNflView() ? selectedNflIdx : selectedCfbIdx;
    weekStripEl.innerHTML = '';
    tabs.forEach(function (tab, idx) {
      var btn = document.createElement('button');
      btn.className = 'week-tab' + (idx === selIdx ? ' selected' : '');
      btn.textContent = tab.label;
      btn.addEventListener('click', function () { selectWeek(idx); });
      weekStripEl.appendChild(btn);
    });
    var sel = weekStripEl.children[selIdx];
    if (sel && sel.scrollIntoView) {
      sel.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }

  function selectWeek(idx) {
    if (isNflView()) {
      selectedNflIdx = idx;
      localStorage.setItem('selectedNFLWeek', JSON.stringify(nflWeekTabs[idx]));
      renderWeekStrip();
      fetchNflWeek(nflWeekTabs[idx]);
    } else {
      selectedCfbIdx = idx;
      localStorage.setItem('selectedCFBWeek', JSON.stringify(cfbWeekTabs[idx]));
      renderWeekStrip();
      fetchCfbWeek(cfbWeekTabs[idx]);
    }
  }

  // ---- View switching ----
  function updateNavButtons() {
    Object.keys(navBtns).forEach(function (v) {
      navBtns[v].className = 'nav-btn' + (activeSport === v ? ' active' : '');
    });
  }

  function updateSubNavButtons() {
    Object.keys(subNavBtns).forEach(function (v) {
      var isActive = cfbFilter === v;
      var btn = subNavBtns[v];
      btn.className = 'subnav-btn' + (isActive ? ' active' : '');
    });
  }

  function updateTopVisibility() {
    subNavEl.className = isNflView() ? 'hidden' : '';
  }

  function switchSport(sport) {
    if (activeSport === sport) return;
    activeSport = sport;
    localStorage.setItem('activeView', sport);
    updateNavButtons();
    updateTopVisibility();
    renderWeekStrip();
    if (isNflView() && !nflLoaded) {
      fetchNflWeek(nflWeekTabs[selectedNflIdx]);
    } else {
      renderTimeline();
    }
  }

  function switchCfbFilter(filter) {
    if (cfbFilter === filter) return;
    cfbFilter = filter;
    localStorage.setItem('cfbFilter', filter);
    updateSubNavButtons();
    renderTimeline();
  }

  navBtns.cfb.addEventListener('click', function () { switchSport('cfb'); });
  navBtns.nfl.addEventListener('click', function () { switchSport('nfl'); });
  subNavBtns.all.addEventListener('click', function () { switchCfbFilter('all'); });
  subNavBtns.starred.addEventListener('click', function () { switchCfbFilter('starred'); });

  // ---- Refresh ----
  function setRefreshState(state, icon) {
    refreshBtn.className = 'nav-btn' + (state ? ' ' + state : '');
    refreshIconEl.textContent = icon;
  }

  function triggerRefresh() {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    setRefreshState('spinning', '⟳');

    var task = isNflView() ? loadNflGames(nflWeekTabs[selectedNflIdx]) : loadCfbGames(cfbWeekTabs[selectedCfbIdx]);
    task
      .then(function () {
        renderTimeline();
        setRefreshState('success', '✓');
      })
      .catch(function () {
        setRefreshState('error', '!');
      })
      .then(function () {
        setTimeout(function () {
          setRefreshState('', '⟳');
          refreshBtn.disabled = false;
        }, 900);
      });
  }

  refreshBtn.addEventListener('click', triggerRefresh);

  // ---- Hamburger menu ----
  function renderMenuTeamList() {
    var starredIds = getMenuStarredTeamIds();
    menuTeamListEl.innerHTML = '';
    P4_ND_TEAMS.forEach(function (group) {
      var groupTitle = document.createElement('div');
      groupTitle.className = 'menu-conf-group-title';
      groupTitle.textContent = group.conf;
      menuTeamListEl.appendChild(groupTitle);

      group.teams.forEach(function (pair) {
        var id = pair[0], name = pair[1];
        var row = document.createElement('div');
        row.className = 'menu-team-row';

        var nameEl = document.createElement('div');
        nameEl.className = 'menu-team-name';
        nameEl.textContent = name;
        row.appendChild(nameEl);

        var starBtn = document.createElement('button');
        var isOn = starredIds.indexOf(id) !== -1;
        starBtn.className = 'menu-team-star' + (isOn ? ' active' : '');
        starBtn.innerHTML = isOn ? '&#9733;' : '&#9734;';
        starBtn.addEventListener('click', function () {
          var ids = getMenuStarredTeamIds();
          var pos = ids.indexOf(id);
          if (pos === -1) ids.push(id); else ids.splice(pos, 1);
          setMenuStarredTeamIds(ids);
          var nowOn = ids.indexOf(id) !== -1;
          starBtn.className = 'menu-team-star' + (nowOn ? ' active' : '');
          starBtn.innerHTML = nowOn ? '&#9733;' : '&#9734;';
          if (!isNflView()) {
            runAutoStar(cfbGames);
            renderTimeline();
          }
        });
        row.appendChild(starBtn);

        menuTeamListEl.appendChild(row);
      });
    });
  }

  function renderMenuRankOptions() {
    var current = getRankingThreshold();
    menuRankOptionsEl.innerHTML = '';
    RANK_OPTIONS.forEach(function (n) {
      var btn = document.createElement('button');
      btn.className = 'menu-rank-btn' + (n === current ? ' active' : '');
      btn.textContent = 'Top ' + n;
      btn.addEventListener('click', function () {
        setRankingThreshold(n);
        renderMenuRankOptions();
        if (!isNflView()) {
          runAutoStar(cfbGames);
          renderTimeline();
        }
      });
      menuRankOptionsEl.appendChild(btn);
    });
  }

  function openMenu() {
    menuNflNote.style.display = isNflView() ? '' : 'none';
    renderMenuTeamList();
    renderMenuRankOptions();
    menuOverlay.style.display = 'flex';
  }

  function closeMenu() {
    menuOverlay.style.display = 'none';
  }

  menuBtn.addEventListener('click', openMenu);
  menuCloseBtn.addEventListener('click', closeMenu);
  menuOverlay.addEventListener('click', function (e) {
    if (e.target === menuOverlay) closeMenu();
  });

  // ---- Week strip drag-scroll ----
  function enableDragScroll(el) {
    var isDown = false, startX, startScrollLeft;

    el.addEventListener('mousedown', function (e) {
      isDown = true;
      el.classList.add('dragging');
      startX = e.pageX;
      startScrollLeft = el.scrollLeft;
    });
    window.addEventListener('mouseup', function () {
      isDown = false;
      el.classList.remove('dragging');
    });
    el.addEventListener('mouseleave', function () {
      isDown = false;
      el.classList.remove('dragging');
    });
    el.addEventListener('mousemove', function (e) {
      if (!isDown) return;
      e.preventDefault();
      el.scrollLeft = startScrollLeft - (e.pageX - startX);
    });
    el.addEventListener('wheel', function (e) {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        el.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });
  }

  // ---- Init ----
  function init() {
    updateNavButtons();
    updateSubNavButtons();
    updateTopVisibility();
    showContentLoading();

    fetch(buildScoreboardUrl('cfb', null))
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var calendar = data.leagues && data.leagues[0] && data.leagues[0].calendar;
        cfbWeekTabs = buildWeekTabs(calendar, 14, ['CFP']);

        var weekNumber = data.week && data.week.number;
        var seasonType = data.season && data.season.type;
        selectedCfbIdx = restoreSelectedIndex(cfbWeekTabs, 'selectedCFBWeek', weekNumber, seasonType);

        if (!isNflView()) renderWeekStrip();

        return loadCfbGames(cfbWeekTabs[selectedCfbIdx]);
      })
      .then(function () {
        if (!isNflView()) {
          setStatus('', false);
          renderTimeline();
        }
      })
      .catch(function () {
        if (!isNflView()) showContentError();
      });

    fetch(buildScoreboardUrl('nfl', null))
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var calendar = data.leagues && data.leagues[0] && data.leagues[0].calendar;
        nflWeekTabs = buildWeekTabs(calendar, null, ['Wild Card', 'Divisional Round', 'Conference Championship', 'Super Bowl']);

        var weekNumber = data.week && data.week.number;
        var seasonType = data.season && data.season.type;
        selectedNflIdx = restoreSelectedIndex(nflWeekTabs, 'selectedNFLWeek', weekNumber, seasonType);

        if (isNflView()) {
          renderWeekStrip();
          return loadNflGames(nflWeekTabs[selectedNflIdx]).then(function () {
            setStatus('', false);
            renderTimeline();
          });
        }
      })
      .catch(function () {
        if (isNflView()) showContentError();
      });
  }

  enableDragScroll(weekStripEl);
  init();
})();

// ---- PWA: Service Worker registration ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/CFB/sw.js', { scope: '/CFB/' })
      .catch(function (err) { console.warn('SW registration failed:', err); });
  });
}

// ---- PWA: Install banner ----
(function () {
  var banner = document.getElementById('pwa-banner');
  var installBtn = document.getElementById('pwa-banner-install');
  var dismissBtn = document.getElementById('pwa-banner-dismiss');
  var subEl = document.getElementById('pwa-banner-sub');
  var deferredPrompt = null;

  function isInstalled() {
    return localStorage.getItem('bspn_installed') === '1'
      || window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  }

  function isDismissedThisSession() {
    return sessionStorage.getItem('bspn_banner_dismissed') === '1';
  }

  function showBanner(mode) {
    if (isInstalled() || isDismissedThisSession()) return;
    if (mode === 'ios') {
      subEl.textContent = 'Tap Share → “Add to Home Screen”';
      installBtn.style.display = 'none';
    } else {
      subEl.textContent = 'Get the full app experience — no browser chrome.';
    }
    banner.classList.remove('hidden');
  }

  // Android/Chrome — beforeinstallprompt
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    showBanner('android');
  });

  // iOS Safari — detect and show advisory banner
  (function () {
    var ua = navigator.userAgent;
    var isIos = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
    var isSafari = /safari/i.test(ua) && !/chrome|crios|fxios/i.test(ua);
    if (isIos && isSafari) showBanner('ios');
  })();

  // Install button — fires the native prompt (Android only)
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function (result) {
      if (result.outcome === 'accepted') {
        localStorage.setItem('bspn_installed', '1');
        banner.classList.add('hidden');
      }
      deferredPrompt = null;
    });
  });

  // Dismiss — session only; banner returns on next visit
  dismissBtn.addEventListener('click', function () {
    sessionStorage.setItem('bspn_banner_dismissed', '1');
    banner.classList.add('hidden');
  });

  // After install event fires — mark permanently done
  window.addEventListener('appinstalled', function () {
    localStorage.setItem('bspn_installed', '1');
    banner.classList.add('hidden');
  });
})();
</script>
